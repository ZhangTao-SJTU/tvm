[package]
name = "vm3d"
version = "0.1.0"
edition = "2021"
description = "Three-dimensional vertex model for periodic cellular tissues"
repository = "https://github.com/ZhangTao-SJTU/tvm"
authors = ["Tao Zhang", "Jennifer Schwarz"]
license = "GPL-3.0-or-later"

[lib]
name = "vm3d"
path = "src/lib.rs"

[[bin]]
name = "tvm"
path = "src/main.rs"

[profile.release]
debug = 1
